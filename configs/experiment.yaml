# happy-housing experiment configuration
experiment:
  name: happy-housing
  commute_target_lon: 20.9830
  commute_target_lat: 52.2300

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlruns.db
  experiment_name: happy-housing
  run_name: null
  log_params: true
  log_metrics: true
  log_artifacts: true
  retain_local_checkpoints: false

data:
  root: data
  fixtures: data/fixtures
  raw: data/raw
  processed: data/processed
  cache: data/cache

bbox:
  west: 20.85
  south: 52.10
  east: 21.28
  north: 52.37
  crs: EPSG:4326
  projected_crs: EPSG:2180

model:
  target: price_per_m2
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 31

ingest_urls:
  gtfs_zip: https://mkuran.pl/gtfs/warsaw.zip
  gios_stations: https://api.gios.gov.pl/pjp-api/v1/rest/station/findAll
  rcn_zip: https://mapa.um.warszawa.pl/rcn_gml/rcn20260622.zip
  gunb_zip: https://wyszukiwarka.gunb.gov.pl/pliki_pobranie/wynik_mazowieckie.zip
  crime_panorama_7z: https://warszawa.stat.gov.pl/download/gfx/warszawa/pl/defaultaktualnosci/760/5/26/1/panorama_dzielnic_warszawy_2024_aneks_excel.7z

# null = unlimited (download everything the source returns)
ingest:
  otodom_max_pages: null
  otodom_max_listings: null
  # true = newest-first merge into existing parquet (skip unchanged details)
  otodom_incremental: true
  olx_max_listings: null
  olx_incremental: true
  olx_include_rent: false
  rcn_max_rows: null

logging:
  level: INFO

# Local routers (Docker). Host :5001 avoids macOS AirPlay on :5000.
# Car = OSRM driving → commute_min. Bike/foot = OSRM bike/foot when graphs
# exist, else speed proxy. use_otp_transit=true fills transit_commute_min.
routing:
  osrm_url: http://127.0.0.1:5001
  otp_url: http://127.0.0.1:8080
  use_otp_transit: true
  require_osrm: true
