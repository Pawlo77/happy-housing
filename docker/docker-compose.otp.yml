# Optional OpenTripPlanner 2 stack for transit routing.
# Primary commute path remains OSRM (car) + GTFS stop proximity in-app.
# Build a graph from data/raw/gtfs_warsaw.zip before starting.

services:
  otp:
    image: opentripplanner/opentripplanner:2.5.0
    ports:
      - "8080:8080"
    volumes:
      - ../data/raw:/var/opentripplanner
    command: >
      --load --serve
    profiles:
      - otp
