services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    ports:
      # Host 5001 — macOS AirPlay Receiver owns :5000 (returns HTTP 403).
      - "5001:5000"
    volumes:
      - ./data/osrm:/data
    # Prepare Mazowieckie extract offline first (see Makefile osrm-prepare).
    command: >
      osrm-routed --algorithm mld /data/mazowieckie-latest.osrm
