[project]
name = "happy-housing"
version = "0.1.0"
description = "Warsaw housing decision aid: fair-price estimates, livability context, and explainable maps from free open data — for buyers, renters, and investors."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
  { name = "Paweł Pozorski", email = "pozorski.paul@gmail.com" },
]
maintainers = [
  { name = "Paweł Pozorski", email = "pozorski.paul@gmail.com" },
]

keywords = [
  "real-estate",
  "warsaw",
  "geospatial",
  "lightgbm",
  "streamlit",
  "duckdb",
  "mlflow",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "duckdb>=1.2.0",
  "geopandas>=1.0.0",
  "humanize>=4.15.0",
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.8",
  "lightgbm>=4.5.0",
  "matplotlib>=3.10.8",
  "mlflow>=3.0.0",
  "mlflow-sysmetrics>=0.1.3",
  "nbformat>=5.10.4",
  "numba>=0.60.0",
  "numpy>=2.4.2",
  "osmnx>=2.0.0",
  "pandas>=2.2.0",
  "psutil>=7.2.2",
  "pyarrow>=18.0.0",
  "pydeck>=0.9.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.2",
  "requests>=2.32.0",
  "scikit-learn>=1.5.0",
  "seaborn>=0.13.2",
  "shap>=0.46.0",
  "shapely>=2.0.0",
  "streamlit>=1.40.0",
  "tqdm>=4.67.0",
]

[project.urls]
Homepage = "https://github.com/Pawlo77/happy-housing"
Repository = "https://github.com/Pawlo77/happy-housing"
Issues = "https://github.com/Pawlo77/happy-housing/issues"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "mypy>=1.16.0",
  "playwright>=1.49.0",
  "prek>=0.4.9",
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
  "types-pyyaml>=6.0.12.20250915",
  "types-requests>=2.32.0",
]

[tool.uv]
required-version = ">=0.11.28"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "T10", "UP"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["happy_housing"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
  "mlflow",
  "mlflow.*",
  "yaml",
  "yaml.*",
  "geopandas",
  "geopandas.*",
  "shapely",
  "shapely.*",
  "osmnx",
  "osmnx.*",
  "lightgbm",
  "lightgbm.*",
  "shap",
  "shap.*",
  "pydeck",
  "pydeck.*",
  "streamlit",
  "streamlit.*",
  "duckdb",
  "duckdb.*",
  "sklearn",
  "sklearn.*",
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
  "pyproj",
  "pyproj.*",
  "requests",
  "requests.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "notebooks", "report"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = []

[tool.coverage.run]
source = ["happy_housing"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.uv.build-backend]
module-name = "happy_housing"
