# Streamlit app configuration — visual theme only via TOML.
# Calm urban analytics: cool slate surfaces, ink accent, geometric sans
# (not Fraunces/editorial, not Inter/purple SaaS).

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[runner]
fastReruns = true

[theme]
base = "light"

# Accent — ink teal (maps / underpriced green language)
primaryColor = "#0F6B5C"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#E8EDF1"
textColor = "#12181F"
linkColor = "#0F6B5C"
linkUnderline = true
borderColor = "#C5CED6"
codeBackgroundColor = "#E4E9EE"
dataframeHeaderBackgroundColor = "#DDE4EA"
dataframeBorderColor = "#C5CED6"

showWidgetBorder = false
showSidebarBorder = true
baseRadius = "0.4rem"
buttonRadius = "0.35rem"

baseFontSize = 15
baseFontWeight = 400
metricValueFontSize = "1.45rem"
metricValueFontWeight = 600

# Typography — Outfit display + IBM Plex Sans body + mono stats
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeFontWeight = 400

headingFontSizes = [
  "2.1rem",
  "1.65rem",
  "1.3rem",
  "1.1rem",
  "1.0rem",
  "0.95rem",
]
headingFontWeights = [650, 600, 600, 550, 550, 500]

# Semantic / chart colours aligned with over/under-priced map language
redColor = "#B42318"
redBackgroundColor = "#FCEBEA"
redTextColor = "#7A271A"
greenColor = "#0F6B5C"
greenBackgroundColor = "#E3F3EE"
greenTextColor = "#0A4A40"
orangeColor = "#B54708"
